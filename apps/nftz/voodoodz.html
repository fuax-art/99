<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voodoodz NFT Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <link rel="stylesheet" href="vd.css">
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-purple-400 mb-2">Voodood NFT Generator</h1>
            <p class="text-lg text-gray-400">Create unique 3D voodood NFTs with customizable attributes</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Panel - Customization Controls -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-2xl font-semibold text-purple-300 mb-4">Customization</h2>
                
                <div class="space-y-6">
                    <!-- Color Palette -->
                    <div>
                        <h3 class="text-lg font-medium mb-2">Color Palette</h3>
                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm mb-1">Body Color</label>
                                <input type="color" id="bodyColor" class="color-picker" value="#8B4513">
                            </div>
                            <div>
                                <label class="block text-sm mb-1">Fabric Color</label>
                                <input type="color" id="fabricColor" class="color-picker" value="#A0522D">
                            </div>
                            <div>
                                <label class="block text-sm mb-1">Eye Color</label>
                                <input type="color" id="eyeColor" class="color-picker" value="#FF0000">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Background Selection -->
                    <div>
                        <h3 class="text-lg font-medium mb-2">Background</h3>
                        <select id="backgroundSelect" class="w-full bg-gray-700 border border-gray-600 rounded-md p-2">
                            <option value="dark">Dark Ritual</option>
                            <option value="wood">Wooden Table</option>
                            <option value="fire">Hellfire</option>
                            <option value="random">Random (Recommended)</option>
                        </select>
                    </div>
                    
                    <!-- Theme Selection -->
                    <div>
                        <h3 class="text-lg font-medium mb-2">Prop Theme</h3>
                        <select id="themeSelect" class="w-full bg-gray-700 border border-gray-600 rounded-md p-2">
                            <option value="traditional">Traditional</option>
                            <option value="pirate">Pirate</option>
                            <option value="gangster">Gangster</option>
                            <option value="random">Random (Recommended)</option>
                        </select>
                    </div>
                    
                    <!-- Generation Options -->
                    <div>
                        <h3 class="text-lg font-medium mb-2">Generation Options</h3>
                        <div class="flex items-center mb-2">
                            <label class="mr-2">Number to Generate:</label>
                            <input type="number" id="generateCount" min="1" max="10" value="5" class="w-16 bg-gray-700 border border-gray-600 rounded-md p-1">
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="randomizeColors" class="mr-2" checked>
                            <label>Randomize Colors</label>
                        </div>
                    </div>
                    
                    <!-- Generate Button -->
                    <button id="generateBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-md transition duration-200">
                        Generate VooDood
                    </button>
                </div>
            </div>
            
            <!-- Center Panel - 3D Preview -->
            <div class="lg:col-span-2">
                <div id="canvas-container">
                    <canvas id="canvas"></canvas>
                </div>
                
                <!-- Generation Progress -->
                <div id="progressContainer" class="mt-4 hidden">
                    <div class="flex justify-between mb-1">
                        <span>Generation Progress</span>
                        <span id="progressText">0/0</span>
                    </div>
                    <div id="generationProgress" class="w-full bg-gray-700 rounded-full h-2.5">
                        <div id="progressBar" class="bg-purple-600 h-2.5 rounded-full progress-bar" style="width: 0%"></div>
                    </div>
                </div>
                
                <!-- Download Links -->
                <div id="downloadLinks" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                    <div class="bg-gray-800 p-4 rounded-lg">
                        <h3 class="text-lg font-medium mb-2">Generated NFTs</h3>
                        <div id="nftList" class="space-y-2"></div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-lg">
                        <h3 class="text-lg font-medium mb-2">Metadata</h3>
                        <div id="metadataList" class="space-y-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="vd.js"></script>
</body>
</html>
