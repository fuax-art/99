<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Art Studio - What will you make of today?</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'VCR OSD Mono', monospace;
            background: linear-gradient(135deg, #0d0d0e 0%, #000000 100%);
            color: rgb(247, 1, 242);
            overflow: hidden;
            user-select: none;
        }
        
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        #mandalaCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: auto;
            touch-action: none;
        }
        
        #threeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 15px;
            padding: 20px;
            z-index: 10;
            max-height: 80vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .control-group {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-group h3 {
            margin: 0 0 15px 0;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        
        label {
            display: block;
            margin: 10px 0 5px 0;
            font-size: 12px;
            font-weight: 500;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 8px 0;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
            border: 2px solid white;
        }
        
        input[type="color"] {
            width: 100%;
            height: 35px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        
        button.active {
            background: rgba(76, 175, 80, 0.8);
            border-color: #4CAF50;
        }
        
        button.premium {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #000;
            font-weight: 600;
            border: 2px solid #FFD700;
        }
        
        button.premium:hover {
            background: linear-gradient(45deg, #FFA500, #FFD700);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        
        .value-display {
            text-align: center;
            font-size: 11px;
            margin-top: 3px;
            color: #ddd;
            font-weight: 500;
        }
        
        .mode-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }
        
        .export-section {
            border-top: 2px solid rgba(255, 215, 0, 0.5);
            padding-top: 20px;
            margin-top: 20px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 165, 0, 0.1));
        }
        
        .price-display {
            text-align: center;
            font-size: 18px;
            color: #FFD700;
            margin: 15px 0;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .revenue-tracker {
            background: rgba(76, 175, 80, 0.2);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid rgba(76, 175, 80, 0.5);
        }
        
        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 25px 50px;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #4CAF50;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(15px);
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        #startButton:hover {
            background: rgba(76, 175, 80, 0.8);
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }
        
        .toggle-controls {
            position: absolute;
            top: 20px;
            right: 340px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 11;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .toggle-controls:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #4CAF50;
        }
        
        .hidden {
            transform: translateX(100%);
            opacity: 0;
        }
        
        .success-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.95);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
            z-index: 1000;
            display: none;
            backdrop-filter: blur(10px);
            border: 2px solid #4CAF50;
        }
        
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .controls {
                width: 90vw;
                right: 5vw;
                max-height: 60vh;
                font-size: 12px;
            }
            
            .toggle-controls {
                right: 20px;
                top: 10px;
            }
            
            button {
                padding: 12px;
                font-size: 14px;
            }
            
            #startButton {
                padding: 20px 40px;
                font-size: 18px;
            }
        }
        
        /* Touch-friendly adjustments */
        @media (hover: none) {
            button {
                padding: 14px;
                font-size: 14px;
            }
            
            input[type="range"]::-webkit-slider-thumb {
                width: 22px;
                height: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="startButton">🎨 Start Creating</button>
        
        <div class="canvas-container">
            <canvas id="mandalaCanvas"></canvas>
            <div id="threeCanvas"></div>
        </div>
        
        <button class="toggle-controls" onclick="toggleControls()">⚙️ Controls</button>
        
        <div class="controls" id="controls">
            <!-- Revenue Tracker -->
            <div class="revenue-tracker">
                <div>💰 Potential Earnings</div>
                <div id="revenueDisplay">$0.00</div>
                <small>Art pieces created: <span id="artCount">0</span></small>
            </div>
            
            <!-- Mode Selection -->
            <div class="control-group">
                <h3>🎨 Art Mode</h3>
                <div class="mode-buttons">
                    <button id="mandalaMode" class="active">Mandala</button>
                    <button id="particleMode">Particles</button>
                </div>
                <button id="combinedMode">✨ Combined Magic</button>
            </div>
            
            <!-- Mandala Controls -->
            <div class="control-group" id="mandalaControls">
                <h3>🌸 Mandala Drawing</h3>
                <h3> 💰Upgrade For Full Features</h3>
                <input type="color" id="mandalaColor" value="#ff0066">
                
                <label>Brush Size: <span id="brushSizeValue">8</span>px</label>
                <input type="range" id="brushSize" min="1" max="40" value="8">
                
                <label>Symmetry Points: <span id="symmetryValue">8</span></label>
                <input type="range" id="symmetryPoints" min="2" max="99" value="8">
                
                <label>
                    <input type="checkbox" id="symmetryToggle" checked> ✨ Enable Symmetry
                </label>
            </div>
            
            <!-- Particle Controls -->
            <div class="control-group" id="particleControls" style="display: none;">
                <h3>✨ Particle Magic</h3>
                <h3> 💰 Upgrade For Full Features</h3>
                <label>Start Color:</label>
                <input type="color" id="particleStartColor" value="#000000">
                <label>End Color:</label>
                <input type="color" id="particleEndColor" value="#ff00f7">
                
                <label>Particle Size: <span id="particleSizeValue">4</span></label>
                <input type="range" id="particleSize" min="1" max="15" value="4" step="0.5">
                
                <label>Gravity: <span id="gravityValue">-0.5</span></label>
                <input type="range" id="gravity" min="-3" max="3" value="-0.5" step="0.1">
                
                <label>Wind Force: <span id="windValue">1</span></label>
                <input type="range" id="windForce" min="0" max="5" value="1" step="0.2">
                
                <label>Emission Rate: <span id="emissionValue">60</span></label>
                <input type="range" id="emissionRate" min="20" max="150" value="60">
            </div>
            
            <!-- Actions -->
            <div class="control-group">
                <h3>🛠️ Actions</h3>
                <button id="clearAll">🗑️ Clear All</button>
                <button id="clearMandala">Clear Mandala Only</button>
                <button id="clearParticles">Clear Particles Only</button>
            </div>
            
            <!-- Export Section -->
            <div class="control-group export-section">
                <h3>💎 Download Your Art</h3>
                <button id="previewExport">👁️ Preview Export</button>
                <div class="price-display">High-res Download: $5.00</div>
                <button id="paymentButton" class="premium">💳 Buy High-res ($5)</button>
                <button id="freeDownload">📸 Free Preview (Watermarked)</button>
                
                <div class="loading-spinner" id="paymentLoading"></div>
            </div>
        </div>
        
        <div class="success-message" id="successMessage">
            ✅ Payment successful! Your high-resolution art is downloading...
        </div>
    </div>

    <script src="nexus.js"></script>
</body>
</html>
