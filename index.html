    <script>
        // Prefer local audio assets in /assets/audio/, with remote fallbacks cached to IndexedDB.
        const LOCAL_SOUNDS = {
            click: 'assets/audio/click.ogg',
            hover: 'assets/audio/hover.ogg',
            back:  'assets/audio/back.ogg'
        };

        // Remote demo fallbacks (used if local assets missing)
        const DEMO_SOUNDS = {
            click: 'https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg',
            hover: 'https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg',
            back:  'https://actions.google.com/sounds/v1/alarms/beep_short.ogg'
        };

        // reuse SOUND_DB_PREFIX and loadAndCacheAudio/ensureHowlForKey implemented below to cache local or remote files

        // helper to play click
        async function playClick() {
            try {
                const local = LOCAL_SOUNDS.click;
                const h = await ensureHowlForKey('click', local || DEMO_SOUNDS.click);
                if (h) h.play();
            } catch (e) {
                console.warn('playClick failed', e);
            }
        }

        // --- Additional sounds: hover and back navigation ---
        const SOUND_DB_PREFIX = 'sound-';

        let hoverHowl = null;
        let backHowl = null;

        async function loadAndCacheAudio(key, url) {
            const dbKey = SOUND_DB_PREFIX + key + '-v1';
            try {
                let blob = await idbKeyval.get(dbKey).catch(() => null);
                if (!blob) {
                    const resp = await fetch(url, { cache: 'reload' });
                    if (!resp.ok) throw new Error('fetch failed');
                    blob = await resp.blob();
                    await idbKeyval.set(dbKey, blob);
                }
                return blob;
            } catch (e) {
                console.warn('Failed to load/cache', key, e);
                return null;
            }
        }

        async function ensureHowlForKey(key, url) {
            if (key === 'hover' && hoverHowl) return hoverHowl;
            if (key === 'back' && backHowl) return backHowl;

            let blob = await loadAndCacheAudio(key, url);
            if (blob) {
                const objUrl = URL.createObjectURL(blob);
                const h = new Howl({ src: [objUrl], html5: false, volume: 1.0 });
                h._objectUrl = objUrl;
                const origUnload = h.unload.bind(h);
                h.unload = function() {
                    if (this._objectUrl) {
                        URL.revokeObjectURL(this._objectUrl);
                        this._objectUrl = null;
                    }
                    origUnload();
                };
                if (key === 'hover') hoverHowl = h;
                if (key === 'back') backHowl = h;
                return h;
            }

            // fallback: try to create Howl directly from url (may be CORS-limited)
            try {
                const h = new Howl({ src: [url], html5: false, volume: 1.0 });
                if (key === 'hover') hoverHowl = h;
                if (key === 'back') backHowl = h;
                return h;
            } catch (e) {
                console.warn('Fallback Howl failed for', key, e);
                return null;
            }
        }

        async function playHover() {
            if (!isSoundEnabled()) return;
            try {
                const h = await ensureHowlForKey('hover', DEMO_SOUNDS.hover);
                if (h) h.play();
            } catch (e) {}
        }

        async function playBack() {
            if (!isSoundEnabled()) return;
            try {
                const h = await ensureHowlForKey('back', DEMO_SOUNDS.back);
                if (h) h.play();
            } catch (e) {}
        }

        // Sound toggle UI (small control)
        function isSoundEnabled() {
            const v = localStorage.getItem('ff_sound_enabled');
            return v === null ? true : v === '1';
        }

        function toggleSoundEnabled() {
            // toggle global mute
            const muted = !isMuted();
            setMuted(muted);
        }

        // Inject toggle button
        (function createSoundToggle() {
            const btn = document.createElement('button');
            btn.id = 'sound-toggle';
            btn.title = 'Toggle sounds';
            btn.style.position = 'absolute';
            btn.style.top = '18px';
            btn.style.right = '18px';
            btn.style.zIndex = 1001;
            btn.style.background = 'rgba(26,26,26,0.6)';
            btn.style.border = '2px solid #0FF4E6';
            btn.style.color = '#B8B8B8';
            btn.style.padding = '6px 10px';
            btn.style.fontSize = '14px';
            btn.style.cursor = 'pointer';
            btn.style.borderRadius = '6px';
            btn.addEventListener('click', () => toggleSoundEnabled());
            btn.textContent = isMuted() ? '�' : '�';
            document.getElementById('container').appendChild(btn);
        })();

        // Warm up demo sounds in background (non-blocking)
        (async function warmupDemoSounds() {
            // do not block: fetch but don't await long
            ensureHowlForKey('hover', DEMO_SOUNDS.hover).catch(()=>{});
            ensureHowlForKey('back', DEMO_SOUNDS.back).catch(()=>{});
        })();

        // Global mute helpers (Howler global mute + persisted setting)
        function isMuted() {
            const v = localStorage.getItem('ff_muted');
            return v === '1';
        }

        function setMuted(val) {
            localStorage.setItem('ff_muted', val ? '1' : '0');
            Howler.mute(val);
            const btn = document.getElementById('sound-toggle');
            if (btn) btn.textContent = val ? '🔈' : '🔊';
        }

        // global hotkey: press 'm' to toggle mute
        window.addEventListener('keydown', (e) => {
            if (e.key && e.key.toLowerCase() === 'm') {
                setMuted(!isMuted());
            }
        });

        // ensure persisted mute setting applied
        setTimeout(() => setMuted(isMuted()), 0);

        // Intro overlay control: show a big welcome circle and wait for click to open visualization
        function showIntro() {
            const overlay = document.getElementById('intro-overlay');
            if (!overlay) {
                createVisualization(data);

            overlay.style.display = 'flex';
            overlay.setAttribute('aria-hidden', 'false');
            const circle = document.getElementById('intro-circle');
            function onClickIntro(e) {

                overlay.classList.add('intro-hide');

                // remove after transition

                    overlay.style.display = 'none';
                    circle.removeEventListener('click', onClickIntro);
                    createVisualization(data);
                }, 420);

            circle.addEventListener('click', onClickIntro);

                    ]

                    children: [

        let width = window.innerWidth;
        let height = window.innerHeight;
        let currentNode = data;
        let navigationStack = [data];
        let animationFrameId = null;
        let bouncingCircles = [];
        
        const svg = d3.select("#canvas");
        const backHint = d3.select("#back-hint");
        const breadcrumb = d3.select("#breadcrumb");

        svg.on("click", function(event) {
            if (event.target.tagName === "svg" && navigationStack.length > 1) {
                navigateBack();
            }
        });

        function updateBreadcrumb() {
            const path = navigationStack.map(n => n.name).filter(n => n).join(" > ");
            breadcrumb.text(path || "FOREVER UNFINISHED");
        }

        function findOriginalNode(parentNode, nodeName) {
            if (parentNode.name === nodeName) {
                return parentNode;
            }
            if (parentNode.children) {
                for (let child of parentNode.children) {
                    if (child.name === nodeName) {
                        return child;
                    }
                }
            }
            return null;
        }

        function createVisualization(node, animate = true) {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            bouncingCircles = [];

            width = window.innerWidth;
            height = window.innerHeight;
            svg.attr("viewBox", `0 0 ${width} ${height}`);

            const isRootLevel = node === data;

            const pack = d3.pack()
                .size([width * 0.85, height * 0.85])
                .padding(25);

            let rootForPacking = node;
            if (isRootLevel) {
                rootForPacking = {
                    ...node,
                    children: node.children.map(child => ({
                        ...child,
                        children: []
                    }))
                };
            }

            const root = d3.hierarchy(rootForPacking)
                .sum(d => d.children && d.children.length > 0 ? 0 : 1)
                .sort((a, b) => b.value - a.value);

            pack(root);

            const nodes = root.descendants();
            const centerX = width / 2;
            const centerY = height / 2;

            svg.selectAll("*").transition().duration(300).style("opacity", 0).remove();

            const g = svg.append("g");
            const defs = svg.append("defs");

            // Create patterns for images
            nodes.forEach((d, i) => {
                if (d.data.image) {
                    const pattern = defs.append("pattern")
                        .attr("id", `img-${i}`)
                        .attr("width", 1)
                        .attr("height", 1)
                        .attr("patternContentUnits", "objectBoundingBox");

                    pattern.append("image")
                        .attr("href", d.data.image)
                        .attr("width", 1)
                        .attr("height", 1)
                        .attr("preserveAspectRatio", "xMidYMid slice");
                }
            });

            const circles = g.selectAll(".circle")
                .data(nodes)
                .enter()
                .append("circle")
                .attr("class", d => {
                    let classes = "circle";
                    if (d.data.name === "Shop") classes += " circle-shop";
                    else if (d.data.name === "NFTs") classes += " circle-nft";
                    else if (d.depth === 1) classes += " circle-parent";
                    else if (d.depth === 2) classes += " circle-child";
                    if (isRootLevel && d.depth === 1) classes += " circle-bouncing";
                    return classes;
                })
                .attr("cx", d => d.x + (centerX - width * 0.425))
                .attr("cy", d => d.y + (centerY - height * 0.425))
                .attr("r", animate ? 0 : d => d.r)
                .attr("fill", (d, i) => d.data.image ? `url(#img-${i})` : (d.data.color || COLORS.DARK_CONCRETE))
                .attr("stroke", d => {
                    if (d.data.name === "Shop") return COLORS.WHITE;
                    if (d.data.name === "NFTs") return COLORS.SHOP;
                    if (d.depth === 1) return COLORS.STEEL;
                    if (d.depth === 2) return COLORS.GRAY;
                    return "none";
                })
                .attr("stroke-width", d => {
                    if (d.data.name === "Shop") return 4;
                    if (d.data.name === "NFTs") return 4;
                    if (d.depth === 1) return 2;
                    if (d.depth === 2) return 1;
                    return 0;
                })
                .style("opacity", 0)
                .on("click", function(event, d) {
                    event.stopPropagation();
                    const originalNodeData = findOriginalNode(node, d.data.name);
                    
                    if (originalNodeData && originalNodeData.children && originalNodeData.children.length > 0) {
                        handleNodeClick(event, originalNodeData);
                    } else if (d.data.url) {
                        playClick();
                        const circle = event.target;
                        const cx = parseFloat(circle.getAttribute("cx"));
                        const cy = parseFloat(circle.getAttribute("cy"));
                        createParticleBurst(cx, cy, d.data.color);
                        setTimeout(() => {
                            window.open(d.data.url, '_blank');
                        }, 300);
                    }
                })
                .on("pointerenter", function(event, d) {
                    // play hover sound when pointer enters an interactive circle
                    playHover();
                });

            // hidden measurement element used to compute widths for wrapping/truncation
            const _measure = svg.append('text')
                .attr('class', '_measure')
                .attr('x', -9999)
                .attr('y', -9999)
                .style('visibility', 'hidden')
                .style('font-family', 'Arial, sans-serif');

            const labels = g.selectAll(".circle-text")
                .data(nodes)
                .enter()
                .append("text")
                .attr("class", "circle-text")
                .attr("x", d => d.x + (centerX - width * 0.425))
                .attr("y", d => d.y + (centerY - height * 0.425))
                .attr("text-anchor", "middle")
                .attr("dominant-baseline", "middle")
                .style("font-size", d => {
                    const baseSize = Math.max(d.r / 5, 8);
                    return `${baseSize}px`;
                })
                .style("fill", d => {
                    if (d.data.name === "Shop" || d.data.name === "NFTs") return COLORS.WHITE;
                    if (d.depth === 1) return COLORS.GRAY;
                    if (d.depth === 2) return COLORS.WHITE;
                    return COLORS.SHOP;
                })
                .style("opacity", 0)
                .style("display", d => (d.depth === 1 || d.depth === 2) ? "block" : "none")
                .each(function(d) {
                    const textEl = d3.select(this);
                    textEl.selectAll('tspan').remove();

                    // Determine available space inside the circle (leave small padding)
                    const paddingFactor = 0.82; // fraction of diameter usable for text width
                    const availWidth = Math.max(20, d.r * 2 * paddingFactor);
                    const availHeight = Math.max(14, d.r * 2 * 0.72); // allow fewer lines vertically

                    // Source text lines priority
                    let sourceText = '';
                    if (d.data && Array.isArray(d.data.labelLines) && d.data.labelLines.length) {
                        sourceText = d.data.labelLines.join(' ');
                    } else if (d.data && typeof d.data.name === 'string' && d.data.name.indexOf('\n') !== -1) {
                        sourceText = d.data.name.replace(/\r?\n+/g, ' ');
                    } else {
                        sourceText = d.data && d.data.name ? String(d.data.name) : '';
                    }

                    const words = sourceText.split(/\s+/).filter(Boolean);
                    if (!words.length) return;

                    // Font sizing parameters
                    const baseFontSize = Math.max(10, Math.round(d.r / 5)); // starting px size
                    const minFontSize = 8; // absolute minimum px
                    const lineHeightEm = 1.0;

                    // helper to measure width of a string at a given font size using hidden measurement text
                    function measureWidth(str, fontSize) {
                        _measure.style('font-size', fontSize + 'px').style('font-family', textEl.style('font-family') || 'Arial, sans-serif').text(str);
                        const bbox = _measure.node().getBBox();
                        return bbox.width;
                    }

                    // Attempt to fit by shrinking font until fits vertically and horizontally
                    let fontSize = baseFontSize;
                    let lines = [];
                    while (true) {
                        // Greedy line building
                        lines = [];
                        let cur = [];
                        for (let w of words) {
                            const test = cur.concat([w]).join(' ');
                            const wWidth = measureWidth(test, fontSize);
                            if (wWidth <= availWidth || cur.length === 0) {
                                cur.push(w);
                            } else {
                                lines.push(cur.join(' '));
                                cur = [w];
                            }
                        }
                        if (cur.length) lines.push(cur.join(' '));

                        const neededHeight = lines.length * fontSize * lineHeightEm;
                        if (neededHeight <= availHeight || fontSize <= minFontSize) break;
                        fontSize = Math.max(minFontSize, Math.floor(fontSize * 0.9));
                    }

                    // If still too big vertically, force truncation with ellipsis on last line
                    const maxLines = Math.floor(availHeight / (fontSize * lineHeightEm)) || 1;
                    if (lines.length > maxLines) {
                        lines = lines.slice(0, maxLines);
                        // truncate last line
                        let last = lines[lines.length - 1];
                        while (measureWidth(last + '…', fontSize) > availWidth && last.length > 0) {
                            // remove last word; if single word, remove chars
                            const parts = last.split(/\s+/);
                            if (parts.length > 1) parts.pop();
                            else last = last.slice(0, -1);
                            last = parts.join(' ') || last;
                        }
                        // if still too long, truncate characters
                        if (measureWidth(last + '…', fontSize) > availWidth) {
                            let truncated = last;
                            while (measureWidth(truncated + '…', fontSize) > availWidth && truncated.length > 0) {
                                truncated = truncated.slice(0, -1);
                            }
                            last = truncated;
                        }
                        lines[lines.length - 1] = last + '…';
                    }

                    // Append tspans centered and vertically centered using explicit x and pixel dy
                    const totalLines = lines.length;
                    const firstDyPx = -((totalLines - 1) / 2) * fontSize * lineHeightEm; // px
                    // compute the x coordinate for this text (matches circles x calculation)
                    const offsetX = (centerX - width * 0.425) || 0;
                    const xPos = d.x + offsetX;
                    lines.forEach((line, i) => {
                        const dyPx = i === 0 ? firstDyPx : (fontSize * lineHeightEm);
                        textEl.append('tspan')
                            .text(line)
                            .attr('dy', dyPx + 'px')
                            .style('font-size', fontSize + 'px')
                            .style('dominant-baseline', 'middle');
                    });
                });

            if (animate) {
                circles.transition()
                    .duration(600)
                    .delay((d, i) => i * 30)
                    .attr("r", d => d.r)
                    .style("opacity", d => d.depth === 2 ? 0.8 : 1);

                labels.transition()
                    .duration(600)
                    .delay((d, i) => i * 30)
                    .style("opacity", 1);
            } else {
                circles.style("opacity", d => d.depth === 2 ? 0.8 : 1);
                labels.style("opacity", 1);
            }

            if (isRootLevel) {
                const mainCircle = nodes[0];
                const bounceNodes = nodes.filter(d => d.depth === 1);
                
                bouncingCircles = bounceNodes.map((d, i) => {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 0.2 + Math.random() * 0.3;
                    const circleIndex = i + 1;
                    const labelIndex = i + 1;
                    
                    return {
                        node: d,
                        x: d.x,
                        y: d.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        element: circles.nodes()[circleIndex],
                        label: labels.nodes()[labelIndex],
                        radius: d.r,
                        containerRadius: mainCircle.r,
                        containerX: mainCircle.x,
                        containerY: mainCircle.y
                    };
                });

                startBounceAnimation();
            }

            if (navigationStack.length > 1) {
                backHint.style("display", "block");
                svg.classed("can-go-back", true);
            } else {
                backHint.style("display", "none");
                svg.classed("can-go-back", false);
            }

            updateBreadcrumb();
        }

        function handleNodeClick(event, nodeData) {
            event.stopPropagation();
            
        playClick();

            const circle = event.target;
            const cx = parseFloat(circle.getAttribute("cx"));
            const cy = parseFloat(circle.getAttribute("cy"));
            createParticleBurst(cx, cy, nodeData.color);

            navigationStack.push(nodeData);
            currentNode = nodeData;
            
            setTimeout(() => {
                createVisualization(nodeData);
            }, 400);
        }

        function navigateBack() {
            if (navigationStack.length > 1) {
                // play navigation back sound
                playBack();
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                navigationStack.pop();
                currentNode = navigationStack[navigationStack.length - 1];
                createVisualization(currentNode);
            }
        }

        function startBounceAnimation() {
            const centerX = width / 2;
            const centerY = height / 2;
            const offsetX = centerX - width * 0.425;
            const offsetY = centerY - height * 0.425;

            function animate() {
                bouncingCircles.forEach(circle => {
                    circle.x += circle.vx;
                    circle.y += circle.vy;

                    const dx = circle.x - circle.containerX;
                    const dy = circle.y - circle.containerY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const maxDistance = circle.containerRadius - circle.radius;

                    if (distance > maxDistance) {
                        const angle = Math.atan2(dy, dx);
                        circle.x = circle.containerX + Math.cos(angle) * maxDistance;
                        circle.y = circle.containerY + Math.sin(angle) * maxDistance;

                        const normalX = dx / distance;
                        const normalY = dy / distance;
                        const dotProduct = circle.vx * normalX + circle.vy * normalY;
                        circle.vx = circle.vx - 2 * dotProduct * normalX;
                        circle.vy = circle.vy - 2 * dotProduct * normalY;

                        circle.vx += (Math.random() - 0.5) * 0.05;
                        circle.vy += (Math.random() - 0.5) * 0.05;
                    }

                    if (circle.element) {
                        circle.element.setAttribute("cx", circle.x + offsetX);
                        circle.element.setAttribute("cy", circle.y + offsetY);
                    }
                    if (circle.label) {
                        circle.label.setAttribute("x", circle.x + offsetX);
                        circle.label.setAttribute("y", circle.y + offsetY);
                    }
                });

                for (let i = 0; i < bouncingCircles.length; i++) {
                    for (let j = i + 1; j < bouncingCircles.length; j++) {
                        const c1 = bouncingCircles[i];
                        const c2 = bouncingCircles[j];
                        
                        const dx = c2.x - c1.x;
                        const dy = c2.y - c1.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const minDistance = c1.radius + c2.radius;

                        if (distance < minDistance) {
                            const angle = Math.atan2(dy, dx);
                            const targetX = c1.x + Math.cos(angle) * minDistance;
                            const targetY = c1.y + Math.sin(angle) * minDistance;
                            const ax = (targetX - c2.x) * 0.5;
                            const ay = (targetY - c2.y) * 0.5;
                            c1.x -= ax;
                            c1.y -= ay;
                            c2.x += ax;
                            c2.y += ay;

                            const tempVx = c1.vx;
                            const tempVy = c1.vy;
                            c1.vx = c2.vx;
                            c1.vy = c2.vy;
                            c2.vx = tempVx;
                            c2.vy = tempVy;
                        }
                    }
                }

                animationFrameId = requestAnimationFrame(animate);
            }

            animate();
        }

        function createParticleBurst(x, y, color) {
            const particleCount = 24;
            const particleColor = COLORS.WHITE;

            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.3;
                const distance = 80 + Math.random() * 80;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                const particle = svg.append("circle")
                    .attr("class", "particle")
                    .attr("cx", x)
                    .attr("cy", y)
                    .attr("r", 4 + Math.random() * 4)
                    .attr("fill", particleColor)
                    .style("filter", `drop-shadow(0 0 6px ${color})`)
                    .attr("opacity", 1);

                particle.classed("particle-burst", true);
                
                particle.transition()
                    .duration(1500)
                    .ease(d3.easeQuadOut)
                    .attr("cx", x + tx)
                    .attr("cy", y + ty)
                    .attr("opacity", 0)
                    .attr("r", 1)
                    .remove();
            }
        }

        let resizeTimer;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => createVisualization(currentNode, false), 250);
        });

    // start with intro overlay; clicking it will call createVisualization
    showIntro();
    </script>
</body>
</html>
