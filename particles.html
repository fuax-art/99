<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensory Syntax</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VCR OSD Mono', monospace;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #container canvas {
            height: 100vh;
        }

        #controls {
            position: absolute;
            top: 60px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 50vh;
            overflow-y: auto;
            width: 280px;
            z-index: 1000;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        #controls.hidden {
            transform: translateX(300px);
            opacity: 0;
            pointer-events: none;
        }

        .control-group {
 margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
 overflow: hidden;
        }

 .control-group-header {
 cursor: pointer;
 padding: 12px;
            background: rgba(255, 255, 255, 0.05);
 }

        .control-group h3 {
            color: #4CAF50; /* Example accent color */
            margin-bottom: 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
 display: inline-block; /* Allow space for icon */
 margin-right: 10px; /* Space between text and icon */
        }

 .control-group-header span {
 float: right; /* Align icon to the right */
            transition: transform 0.3s ease;
 }

 .control-group-header.collapsed span {
 transform: rotate(-90deg);
 }
        .control-item {
            margin-bottom: 5px;
        }

        label {
            display: block;
            margin-bottom: 3px;
            font-size: 11px;
            color: #ccc;
        }

 .control-group-body {
 padding: 10px;
            transition: max-height 0.5s ease-in-out; /* Smooth collapse animation */
 overflow: hidden;
 }

        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }

        input[type="color"] {
            width: 100%;
            height: 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 5px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        select option {
            background: #333;
            color: white;
        }

        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .value-display {
            font-size: 11px;
            color: #aaa;
            text-align: right;
        }

        #stats {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            color: #ccc;
        }

        .toggle-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .toggle-controls:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            #controls {
                width: calc(100vw - 40px);
                max-height: 60vh;
                top: auto;
                bottom: 20px;
                right: 20px;
                left: 20px;
            }
            
            #controls.hidden {
                transform: translateY(100%);
            }
            
            .toggle-controls {
                top: auto;
                bottom: calc(60vh + 40px);
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <button class="toggle-controls" onclick="toggleControls()" title="Toggle Controls">⚙️</button>
        
        <div id="controls">
            <div class="control-group">
 <div class="control-group-header">
 <h3>Interaction</h3>
 <span>▼</span>
 </div>
 <div class="control-group-body">
 <div class="control-item">
 <label>Click Burst Size</label>
                    <input type="range" id="burstSize" min="10" max="200" value="50" step="10">
                    <div class="value-display" id="burstSizeValue">50</div>
                </div>
 <div class="control-item">
                    <label>Drag Trail Density</label>
                    <input type="range" id="trailDensity" min="5" max="50" value="20" step="5">
                    <div class="value-display" id="trailDensityValue">20</div>
                </div>
            </div>
            </div>

            <div class="control-group">
                <div class="control-group-header">
 <h3>Emission</h3>
 <span>▼</span>
 </div>
                <div class="control-item">
 <label>Particle Count</label>
                    <input type="range" id="particleCount" min="100" max="10000" value="1000" step="100">
                    <div class="value-display" id="particleCountValue">1000</div>
                </div>
 <div class="control-group-body">
                    <label>Emission Rate</label>
                    <input type="range" id="emissionRate" min="1" max="100" value="50" step="1">
                    <div class="value-display" id="emissionRateValue">50/s</div>
                </div>
            </div>

            <div class="control-group">
 <div class="control-group-header">
 <h3>Physics</h3>
 <span>▼</span>
 </div>
 <div class="control-group-body">
 <div class="control-item">
                    <label>Gravity</label>
                    <input type="range" id="gravity" min="-2" max="2" value="-0.01" step="0.001">
                    <div class="value-display" id="gravityValue">-0.01</div>
                </div>
 <div class="control-item">
                    <label>Initial Speed</label>
                    <input type="range" id="initialSpeed" min="0" max="5" value="2" step="0.1">
                    <div class="value-display" id="initialSpeedValue">2</div>
                </div>
 <div class="control-item">
                    <label>Spread Angle</label>
                    <input type="range" id="spreadAngle" min="0" max="360" value="45" step="1">
                    <div class="value-display" id="spreadAngleValue">45°</div>
                </div>
 <div class="control-item">
                    <label>Air Resistance</label>
                    <input type="range" id="airResistance" min="0" max="0.1" value="0.01" step="0.001">
                    <div class="value-display" id="airResistanceValue">0.01</div>
                </div>
 </div>
            </div>

            <div class="control-group">
 <div class="control-group-header">
 <h3>Appearance</h3>
 <span>▼</span>
 </div>
 <div class="control-group-body">
 <div class="control-item">
                    <label>Start Color</label>
                    <input type="color" id="startColor" value="#ff4444">
                </div>
 <div class="control-item">
                    <label>End Color</label>
                    <input type="color" id="endColor" value="#4444ff">
                </div>
 <div class="control-item">
                    <label>Size</label>
                    <input type="range" id="particleSize" min="0.1" max="10" value="2" step="0.1">
                    <div class="value-display" id="particleSizeValue">2</div>
                </div>
 <div class="control-item">
                    <label>Size Variation</label>
                    <input type="range" id="sizeVariation" min="0" max="5" value="1" step="0.1">
                    <div class="value-display" id="sizeVariationValue">1</div>
                </div>
 <div class="control-item">
                    <label>Opacity</label>
                    <input type="range" id="opacity" min="0" max="1" value="0.8" step="0.1">
                    <div class="value-display" id="opacityValue">0.8</div>
                </div>
 </div>
            </div>
 

            <div class="control-group">
 <div class="control-group-header">
 <h3>Behavior</h3>
 <span>▼</span>
 </div>
 <div class="control-group-body">
 <div class="control-item">
                    <label>Lifespan</label>
                    <input type="range" id="lifespan" min="1" max="20" value="5" step="0.5">
                    <div class="value-display" id="lifespanValue">5s</div>
                </div>
 <div class="control-item">
                    <label>Turbulence</label>
                    <input type="range" id="turbulence" min="0" max="2" value="0.1" step="0.01">
                    <div class="value-display" id="turbulenceValue">0.1</div>
                </div>
 <div class="control-item">
                    <label>Shape</label>
                    <select id="particleShape">
                        <option value="point">Point</option>
                        <option value="sphere">Sphere</option>
                        <option value="cube">Cube</option>
                    </select>
                </div>
                <div class="control-item">
 <label>Blend Mode</label>
                    <select id="blendMode">
                        <option value="normal">Normal</option>
                        <option value="additive">Additive</option>
                        <option value="Burn">Burn</option>
                        <option value="Dodge">Dodge</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <div class="control-group-header">
                <h3>Environment</h3>
                <span>▼</span>
            </div>
            <div class="control-group-body">
                <div class="control-item">
                    <label>Wind X</label>
                    <input type="range" id="windX" min="-2" max="2" value="0" step="0.01">
                    <div class="value-display" id="windXValue">0</div>
                </div>
                <div class="control-item">
                    <label>Wind Y</label>
                    <input type="range" id="windY" min="-2" max="2" value="0" step="0.01">
                    <div class="value-display" id="windYValue">0</div>
                </div>
                <div class="control-item">
                    <label>Wind Z</label>
                    <input type="range" id="windZ" min="-2" max="2" value="0" step="0.01">
                    <div class="value-display" id="windZValue">0</div>
                </div>
            </div>

            <div class="control-group">
                <button onclick="resetToDefaults()">Reset to Defaults</button>
                <button onclick="toggleAnimation()" id="animationButton">Pause</button>
            </div>
        </div>

        <div id="stats">
            <div>Active Particles: <span id="activeParticles">0</span></div>
            <div>FPS: <span id="fps">60</span></div>
        </div>
    </div>

    <script>
        // Global variables
        let scene, camera, renderer, particles, particleSystem, emitter;
        let animationId;
        let isAnimating = true;
        let controlsVisible = true;
        
        // Particle system parameters
        let particleParams = {
            count: 1000,
            emissionRate: 50,
            gravity: -0.01,
            initialSpeed: 2,
            spreadAngle: 45,
            airResistance: 0.01,
            startColor: new THREE.Color(0xff4444),
            endColor: new THREE.Color(0x4444ff),
            size: 2,
            sizeVariation: 1,
            opacity: 0.8,
            lifespan: 5,
            turbulence: 0.1,
            shape: 'point',
            blendMode: 'normal',
            windX: 0,
            windY: 0,
            windZ: 0,
            burstSize: 50,
            trailDensity: 20
        };

        // Particle class
        class Particle {
            constructor(position, velocity) {
                this.position = position.clone();
                this.velocity = velocity.clone();
                this.life = particleParams.lifespan;
                this.maxLife = particleParams.lifespan;
                this.size = particleParams.size + (Math.random() - 0.5) * particleParams.sizeVariation;
                this.turbulenceOffset = Math.random() * 1000;
            }

            update(deltaTime) {
                // Apply gravity
                this.velocity.y += particleParams.gravity * deltaTime;
                
                // Apply air resistance
                this.velocity.multiplyScalar(1 - particleParams.airResistance * deltaTime);
                
                // Apply wind
                this.velocity.x += particleParams.windX * deltaTime;
                this.velocity.y += particleParams.windY * deltaTime;
                this.velocity.z += particleParams.windZ * deltaTime;
                
                // Apply turbulence
                const time = Date.now() * 0.001;
                const turbulence = particleParams.turbulence;
                this.velocity.x += Math.sin(time + this.turbulenceOffset) * turbulence * deltaTime;
                this.velocity.z += Math.cos(time + this.turbulenceOffset * 1.1) * turbulence * deltaTime;
                
                // Update position
                this.position.add(this.velocity.clone().multiplyScalar(deltaTime));
                
                // Update life
                this.life -= deltaTime;
                
                return this.life > 0;
            }

            getLifeRatio() {
                return this.life / this.maxLife;
            }
        }

        // Particle system class
        class ParticleSystem {
            constructor() {
                this.particles = [];
                this.geometry = new THREE.BufferGeometry();
                this.positions = new Float32Array(particleParams.count * 3);
                this.colors = new Float32Array(particleParams.count * 3);
                this.sizes = new Float32Array(particleParams.count);
                this.alphas = new Float32Array(particleParams.count);
                
                this.geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
                this.geometry.setAttribute('color', new THREE.BufferAttribute(this.colors, 3));
                this.geometry.setAttribute('size', new THREE.BufferAttribute(this.sizes, 1));
                this.geometry.setAttribute('alpha', new THREE.BufferAttribute(this.alphas, 1));
                
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        pointTexture: { value: this.createParticleTexture() }
                    },
                    vertexShader: `
                        attribute float size;
                        attribute float alpha;
                        varying float vAlpha;
                        varying vec3 vColor;
                        
                        void main() {
                            vAlpha = alpha;
                            vColor = color;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            gl_PointSize = size * (300.0 / -mvPosition.z);
 gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D pointTexture;
                        varying float vAlpha;
                        varying vec3 vColor;
                        
                        void main() {
                            gl_FragColor = vec4(vColor, vAlpha);
                            gl_FragColor = gl_FragColor * texture2D(pointTexture, gl_PointCoord);
                        }
                    `,
                    blending: THREE.AdditiveBlending,
                    depthTest: false,
                    transparent: true,
                    vertexColors: true
                });
                
                this.points = new THREE.Points(this.geometry, this.material);
                scene.add(this.points);
                
                this.emissionTimer = 0;
            }

            createParticleTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const context = canvas.getContext('2d');
                
                const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.5, 'rgba(255,255,255,0.5)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                
                context.fillStyle = gradient;
                context.fillRect(0, 0, 64, 64);
                
                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }

            emit(count, position = new THREE.Vector3(0, 0, 0)) {
                for (let i = 0; i < count; i++) {
                    if (this.particles.length >= particleParams.count) break;
                    
                    const angle = (Math.random() - 0.5) * particleParams.spreadAngle * Math.PI / 180;
                    const elevation = (Math.random() - 0.5) * particleParams.spreadAngle * Math.PI / 180;
                    
                    const velocity = new THREE.Vector3(
                        Math.sin(angle) * Math.cos(elevation),
                        Math.sin(elevation),
                        Math.cos(angle) * Math.cos(elevation)
                    ).multiplyScalar(particleParams.initialSpeed * (0.5 + Math.random() * 0.5));
                    
                    this.particles.push(new Particle(position, velocity));
                }
            }

            update(deltaTime) {
                // Emit new particles
                this.emissionTimer += deltaTime;
                const emissionInterval = 1 / particleParams.emissionRate;
                
                while (this.emissionTimer >= emissionInterval && this.particles.length < particleParams.count) {
                    this.emit(1);
                    this.emissionTimer -= emissionInterval;
                }
                
                // Update existing particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    if (!this.particles[i].update(deltaTime)) {
                        this.particles.splice(i, 1);
                    }
                }
                
                // Update geometry
                this.updateGeometry();
            }

            updateGeometry() {
                const positions = this.geometry.attributes.position.array;
                const colors = this.geometry.attributes.color.array;
                const sizes = this.geometry.attributes.size.array;
                const alphas = this.geometry.attributes.alpha.array;
                
                for (let i = 0; i < particleParams.count; i++) {
                    if (i < this.particles.length) {
                        const particle = this.particles[i];
                        const lifeRatio = particle.getLifeRatio();
                        
                        positions[i * 3] = particle.position.x;
                        positions[i * 3 + 1] = particle.position.y;
                        positions[i * 3 + 2] = particle.position.z;
                        
                        // Interpolate color
                        const color = particleParams.startColor.clone().lerp(particleParams.endColor, 1 - lifeRatio);
                        colors[i * 3] = color.r;
                        colors[i * 3 + 1] = color.g;
                        colors[i * 3 + 2] = color.b;
                        
                        sizes[i] = particle.size * lifeRatio;
                        alphas[i] = particleParams.opacity * lifeRatio;
                    } else {
                        // Hide unused particles
                        positions[i * 3] = 0;
                        positions[i * 3 + 1] = 0;
                        positions[i * 3 + 2] = 0;
                        alphas[i] = 0;
                        sizes[i] = 0;
                    }
                }
                
                this.geometry.attributes.position.needsUpdate = true;
                this.geometry.attributes.color.needsUpdate = true;
                this.geometry.attributes.size.needsUpdate = true;
                this.geometry.attributes.alpha.needsUpdate = true;
            }

            updateBlendMode() {
                const blendModes = {
                    'normal': THREE.NormalBlending,
                    'additive': THREE.AdditiveBlending,
                    'multiply': THREE.MultiplyBlending
                };
                this.material.blending = blendModes[particleParams.blendMode];
            }
        }

        // Initialize Three.js scene
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000011);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Particle system
            particleSystem = new ParticleSystem();
            
            // Controls
            setupControls();
            
            // Start animation
            animate();
            
            // Mouse interaction
            setupMouseInteraction();
        }

        function setupControls() {
            const controls = document.querySelectorAll('input, select');
            
            controls.forEach(control => {
                control.addEventListener('input', (e) => {
                    updateParameter(e.target.id, e.target.value, e.target.type);
                });
                
                // Initialize value displays
                if (control.type === 'range') {
                    updateValueDisplay(control.id, control.value);
                }
            });

            // Setup collapsible headers
            document.querySelectorAll('.control-group-header').forEach(header => {
                header.addEventListener('click', () => {
                    const body = header.nextElementSibling;
                    header.classList.toggle('collapsed');
                    if (header.classList.contains('collapsed')) {
                        body.style.maxHeight = '0';
                    } else {
                        // Calculate height needed for content
 body.style.maxHeight = body.scrollHeight + 'px';
                    }
                });
            });
        }

        function updateParameter(id, value, type) {
            const numValue = type === 'color' ? value : parseFloat(value);
            
            switch(id) {
                case 'particleCount':
                    particleParams.count = parseInt(value);
                    updateValueDisplay(id, value);
                    break;
                case 'emissionRate':
                    particleParams.emissionRate = numValue;
                    updateValueDisplay(id, value + '/s');
                    break;
                case 'gravity':
                    particleParams.gravity = numValue;
                    updateValueDisplay(id, value);
                    break;
                case 'initialSpeed':
                    particleParams.initialSpeed = numValue;
                    updateValueDisplay(id, value);
                    break;
                case 'spreadAngle':
                    particleParams.spreadAngle = numValue;
                    updateValueDisplay(id, value + '°');
                    break;
                case 'airResistance':
                    particleParams.airResistance = numValue;
                    updateValueDisplay(id, value);
                    break;
                case 'startColor':
                    particleParams.startColor = new THREE.Color(value);
                    break;
                case 'endColor':
                    particleParams.endColor = new THREE.Color(value);
                    break;
                case 'particleSize':
                    particleParams.size = numValue;
                    updateValueDisplay(id, value);
                    break;
                case 'sizeVariation':
                    particleParams.sizeVariation = numValue;
                    updateValueDisplay(id, value);
                    break;
                case 'opacity':
                    particleParams.opacity = numValue;
                    updateValueDisplay(id, value);
                    break;
                case 'lifespan':
                    particleParams.lifespan = numValue;
                    updateValueDisplay(id, value + 's');
                    break;
                case 'turbulence':
                    particleParams.turbulence = numValue;
                    updateValueDisplay(id, value);
                    break;
                case 'particleShape':
                    particleParams.shape = value;
                    break;
                case 'blendMode':
                    particleParams.blendMode = value;
                    particleSystem.updateBlendMode();
                    break;
                case 'windX':
                    particleParams.windX = numValue;
                    updateValueDisplay(id, value);
                    break;
                case 'windY':
                    particleParams.windY = numValue;
                    updateValueDisplay(id, value);
                    break;
                case 'windZ':
                    particleParams.windZ = numValue;
                    updateValueDisplay(id, value);
                    break;
                case 'burstSize':
                    particleParams.burstSize = parseInt(value);
                    updateValueDisplay(id, value);
                    break;
                case 'trailDensity':
                    particleParams.trailDensity = parseInt(value);
                    updateValueDisplay(id, value);
                    break;
            }
        }

        function updateValueDisplay(id, value) {
            const display = document.getElementById(id + 'Value');
            if (display) {
                display.textContent = value;
            }
        }

        function setupMouseInteraction() {
            let mouseX = 0, mouseY = 0;
            let targetCameraX = 0, targetCameraY = 5;
            let isMouseDown = false;
            let lastEmissionTime = 0;
            
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            // Convert screen coordinates to 3D world position
            function getWorldPosition(clientX, clientY) {
                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                
                // Create an invisible plane to intersect with
                const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                const intersectPoint = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, intersectPoint);
                
                return intersectPoint;
            }
            
            // Emit particles at specific position
            function emitAtPosition(worldPos) {
                const currentTime = Date.now();
                if (currentTime - lastEmissionTime > 50) { // Throttle emissions
                    const burstCount = Math.min(particleParams.trailDensity, particleParams.emissionRate);
                    particleSystem.emit(burstCount, worldPos);
                    lastEmissionTime = currentTime;
                }
            }
            
            // Mouse events
            document.addEventListener('mousemove', (event) => {
                if (!event.target.closest('#controls')) {
                    mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                    mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
                    
                    targetCameraX = mouseX * 10;
                    targetCameraY = mouseY * 10 + 5;
                    
                    // Emit particles while dragging
                    if (isMouseDown) {
                        const worldPos = getWorldPosition(event.clientX, event.clientY);
                        emitAtPosition(worldPos);
                    }
                }
            });
            
            document.addEventListener('mousedown', (event) => {
                if (!event.target.closest('#controls') && !event.target.closest('.toggle-controls')) {
                    isMouseDown = true;
                    const worldPos = getWorldPosition(event.clientX, event.clientY);
                    emitAtPosition(worldPos);
                    event.preventDefault();
                }
            });
            
            document.addEventListener('mouseup', () => {
                isMouseDown = false;
            });
            
            document.addEventListener('click', (event) => {
                if (!event.target.closest('#controls') && !event.target.closest('.toggle-controls')) {
                    const worldPos = getWorldPosition(event.clientX, event.clientY);
                    particleSystem.emit(particleParams.burstSize, worldPos);
                }
            });
            
            // Touch events for mobile
            document.addEventListener('touchstart', (event) => {
                if (!event.target.closest('#controls')) {
                    const touch = event.touches[0];
                    const worldPos = getWorldPosition(touch.clientX, touch.clientY);
                    particleSystem.emit(particleParams.burstSize, worldPos);
                    event.preventDefault();
                }
            }, { passive: false });
            
            document.addEventListener('touchmove', (event) => {
                if (!event.target.closest('#controls')) {
                    const touch = event.touches[0];
                    const worldPos = getWorldPosition(touch.clientX, touch.clientY);
                    emitAtPosition(worldPos);
                    
                    // Update camera based on touch position
                    mouseX = (touch.clientX / window.innerWidth) * 2 - 1;
                    mouseY = -(touch.clientY / window.innerHeight) * 2 + 1;
                    targetCameraX = mouseX * 10;
                    targetCameraY = mouseY * 10 + 5;
                    
                    event.preventDefault();
                }
            }, { passive: false });
            
            // Multi-touch support
            document.addEventListener('touchstart', (event) => {
                if (!event.target.closest('#controls') && event.touches.length > 1) {
                    // Emit particles at all touch points
                    for (let i = 0; i < Math.min(event.touches.length, 5); i++) {
                        const touch = event.touches[i];
                        const worldPos = getWorldPosition(touch.clientX, touch.clientY);
                        particleSystem.emit(particleParams.burstSize / 2, worldPos);
                    }
                    event.preventDefault();
                }
            }, { passive: false });
            
            // Smooth camera movement
            function updateCamera() {
                camera.position.x += (targetCameraX - camera.position.x) * 0.05;
                camera.position.y += (targetCameraY - camera.position.y) * 0.05;
                camera.lookAt(0, 0, 0);
            }
            
            // Add to animation loop
            const originalAnimate = animate;
            animate = function() {
                updateCamera();
                originalAnimate();
            };
        }

        // Animation loop
        let lastTime = 0;
        let frameCount = 0;
        let fpsTimer = 0;

        function animate() {
            if (!isAnimating) return;
            
            animationId = requestAnimationFrame(animate);
            
            const currentTime = performance.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            
            // Update particle system
            if (particleSystem) {
                particleSystem.update(deltaTime);
            }
            
            // Update stats
            frameCount++;
            fpsTimer += deltaTime;
            
            if (fpsTimer >= 1) {
                document.getElementById('fps').textContent = Math.round(frameCount / fpsTimer);
                document.getElementById('activeParticles').textContent = particleSystem ? particleSystem.particles.length : 0;
                frameCount = 0;
                fpsTimer = 0;
            }
            
            // Render
            renderer.render(scene, camera);
        }

        // Utility functions
        function toggleControls() {
            const controls = document.getElementById('controls');
            controlsVisible = !controlsVisible;
            
            if (controlsVisible) {
                controls.classList.remove('hidden');
            } else {
                controls.classList.add('hidden');
            }
        }

        function toggleAnimation() {
            isAnimating = !isAnimating;
            const button = document.getElementById('animationButton');
            
            if (isAnimating) {
                button.textContent = 'Pause';
                lastTime = performance.now();
                animate();
            } else {
                button.textContent = 'Play';
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
            }
        }

        function resetToDefaults() {
            document.getElementById('particleCount').value = 1000;
            document.getElementById('emissionRate').value = 50;
            document.getElementById('gravity').value = -0.01;
            document.getElementById('initialSpeed').value = 2;
            document.getElementById('spreadAngle').value = 45;
            document.getElementById('airResistance').value = 0.01;
            document.getElementById('startColor').value = '#ff4444';
            document.getElementById('endColor').value = '#4444ff';
            document.getElementById('particleSize').value = 2;
            document.getElementById('sizeVariation').value = 1;
            document.getElementById('opacity').value = 0.8;
            document.getElementById('lifespan').value = 5;
            document.getElementById('turbulence').value = 0.1;
            document.getElementById('particleShape').value = 'point';
            document.getElementById('blendMode').value = 'normal';
            document.getElementById('windX').value = 0;
            document.getElementById('windY').value = 0;
            document.getElementById('windZ').value = 0;
            document.getElementById('burstSize').value = 50;
            document.getElementById('trailDensity').value = 20;
            
            // Trigger updates
            document.querySelectorAll('input, select').forEach(control => {
                control.dispatchEvent(new Event('input'));
            });
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            // Re-calculate max-height for collapsible sections on resize
            document.querySelectorAll('.control-group-header:not(.collapsed)').forEach(header => {
                const body = header.nextElementSibling;
                if (body) {
                    body.style.maxHeight = body.scrollHeight + 'px';
                }
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize the app
        init();
    </script>
</body>
</html>
