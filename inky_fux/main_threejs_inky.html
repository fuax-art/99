<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Blob Creature NFT Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }

        #container { /* This is now the canvas container */
            width: 100vw;
            height: 100vh;
        }
        #ui-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px; /* Adjust width as needed */
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            z-index: 100;
            background-color: red; /* Debug: Added background color */
            border: 2px solid yellow; /* Debug: Added border */
        }
        
        .control-group h3 {
            margin: 0 0 10px 0;
            color: #ff6b6b;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            color: white;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }
        
        .trait-display {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .trait-item {
            margin: 3px 0;
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
        }
    </style>
    <script src="main_threejs_inky.js" type="module"></script>
</head>

<body>
 <div id="container">
 <!-- Three.js canvas will be appended here -->
 </div>
 <div id="ui-panel">
 <div id="controls">
 <div class="control-group">
 <h3>🎨 Ink Blob Generator</h3>
 <button id="generateCreatureButton">Generate New Creature</button>
 <button id="exportNFTButton">Export NFT</button>
 <button id="randomizeAllButton">Randomize All</button>
 </div>
 <div class="control-group">
 <h3>⚡ Quick Actions</h3>
 <button id="changeBackgroundButton">Change Scene</button>
 <button id="toggleAnimationButton">Toggle Animation</button>
 </div>
 <div class="trait-display" id="traits">
 <div class="trait-item">Click "Generate New Creature" to start!</div>
 </div>
 </div>
 <div id="info">
 <strong>Ink Blob Creatures</strong><br>
 Urban Art Collection<br>
 Use mouse to rotate view
 </div>
 </div>
</body>
</html>
