<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Creatures NFT Collection</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            font-family: 'Arial', sans-serif;
            color: #fff;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin: 0;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .nft-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .nft-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        
        .canvas-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .nft-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nft-name {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .rarity {
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .common { background: #6c757d; }
        .uncommon { background: #28a745; }
        .rare { background: #007bff; }
        .epic { background: #6f42c1; }
        .legendary { background: #ffc107; color: #000; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
            font-size: 0.9em;
        }
        
        .stat {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>INK CREATURES</h1>
            <p>Streetwear Culture Meets Digital Art</p>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="generateSingle()">Generate Single</button>
            <button class="btn" onclick="generateBatch()">Generate 10</button>
            <button class="btn" onclick="generateCollection()">Generate 50</button>
            <button class="btn" onclick="clearGallery()">Clear Gallery</button>
            <button class="btn" onclick="downloadAll()">Download All</button>
        </div>
        
        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        // Trait definitions
        const traits = {
            bodyTypes: [
                'slim', 'chubby', 'tall', 'short', 'muscular'
            ],
            
            heads: [
                'round', 'oval', 'square', 'triangle'
            ],
            
            eyes: [
                'small_dots', 'large_circles', 'glowing', 'tired', 'angry', 'happy', 
                'crossed', 'winking', 'sleepy', 'wide'
            ],
            
            mouths: [
                'none', 'small_line', 'smile', 'frown', 'open', 'teeth', 'drool'
            ],
            
            clothing: [
                'hoodie', 'bomber_jacket', 'tank_top', 'oversized_tee', 'varsity_jacket',
                'denim_jacket', 'tracksuit', 'mesh_top', 'crop_top', 'flannel'
            ],
            
            accessories: [
                'chains', 'cap_backwards', 'beanie', 'headphones', 'sunglasses',
                'bandana', 'earrings', 'choker', 'watch', 'rings'
            ],
            
            tools: [
                'spray_can', 'marker', 'paint_brush', 'stencil', 'roller',
                'none', 'multiple_cans', 'paint_bucket'
            ],
            
            backgrounds: [
                'brick_wall', 'subway', 'alley', 'rooftop', 'warehouse',
                'train_yard', 'underpass', 'street_corner', 'garage'
            ],
            
            colors: [
                '#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7',
                '#a29bfe', '#fd79a8', '#fdcb6e', '#e17055', '#74b9ff'
            ]
        };

        let nftCount = 0;
        const generatedNFTs = [];

        function getRandomTrait(category) {
            const options = traits[category];
            return options[Math.floor(Math.random() * options.length)];
        }

        function getRandomColor() {
            return traits.colors[Math.floor(Math.random() * traits.colors.length)];
        }

        function calculateRarity(nft) {
            let rarity = 'common';
            let score = 0;
            
            // Legendary combinations
            if (nft.tools === 'multiple_cans' && nft.accessories === 'chains' && nft.clothing === 'bomber_jacket') {
                return 'legendary';
            }
            
            // Epic traits
            if (['glowing', 'crossed'].includes(nft.eyes)) score += 3;
            if (['multiple_cans', 'paint_bucket'].includes(nft.tools)) score += 3;
            if (['bomber_jacket', 'varsity_jacket'].includes(nft.clothing)) score += 2;
            
            // Rare traits
            if (['angry', 'winking'].includes(nft.eyes)) score += 2;
            if (['chains', 'headphones'].includes(nft.accessories)) score += 2;
            
            if (score >= 6) rarity = 'epic';
            else if (score >= 4) rarity = 'rare';
            else if (score >= 2) rarity = 'uncommon';
            
            return rarity;
        }

        function drawInkCreature(canvas, nft) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            // Draw background
            drawBackground(ctx, nft.background, width, height);
            
            // Draw body
            drawBody(ctx, nft, width, height);
            
            // Add ink effects
            drawInkEffects(ctx, width, height);
        }

        function drawBackground(ctx, bg, width, height) {
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            
            switch(bg) {
                case 'brick_wall':
                    gradient.addColorStop(0, '#4a4a4a');
                    gradient.addColorStop(1, '#2a2a2a');
                    break;
                case 'subway':
                    gradient.addColorStop(0, '#1a1a2e');
                    gradient.addColorStop(1, '#16213e');
                    break;
                case 'alley':
                    gradient.addColorStop(0, '#2c3e50');
                    gradient.addColorStop(1, '#34495e');
                    break;
                default:
                    gradient.addColorStop(0, '#333');
                    gradient.addColorStop(1, '#111');
            }
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Add texture
            ctx.globalAlpha = 0.3;
            for (let i = 0; i < 50; i++) {
                ctx.fillStyle = getRandomColor();
                ctx.fillRect(
                    Math.random() * width,
                    Math.random() * height,
                    Math.random() * 3,
                    Math.random() * 3
                );
            }
            ctx.globalAlpha = 1;
        }

        function drawBody(ctx, nft, width, height) {
            const centerX = width / 2;
            const centerY = height / 2;
            
            // Main body color
            ctx.fillStyle = getRandomColor();
            
            // Draw body based on type
            switch(nft.bodyType) {
                case 'slim':
                    drawSlimBody(ctx, centerX, centerY);
                    break;
                case 'chubby':
                    drawChubbyBody(ctx, centerX, centerY);
                    break;
                case 'tall':
                    drawTallBody(ctx, centerX, centerY);
                    break;
                default:
                    drawDefaultBody(ctx, centerX, centerY);
            }
            
            // Draw head
            drawHead(ctx, nft, centerX, centerY - 60);
            
            // Draw clothing
            drawClothing(ctx, nft.clothing, centerX, centerY);
            
            // Draw accessories
            drawAccessories(ctx, nft.accessories, centerX, centerY - 60);
            
            // Draw tools
            drawTools(ctx, nft.tools, centerX + 50, centerY);
        }

        function drawSlimBody(ctx, x, y) {
            ctx.fillRect(x - 25, y - 40, 50, 80);
            // Arms
            ctx.fillRect(x - 45, y - 30, 15, 60);
            ctx.fillRect(x + 30, y - 30, 15, 60);
            // Legs
            ctx.fillRect(x - 20, y + 40, 15, 60);
            ctx.fillRect(x + 5, y + 40, 15, 60);
        }

        function drawChubbyBody(ctx, x, y) {
            ctx.fillRect(x - 35, y - 40, 70, 80);
            // Arms
            ctx.fillRect(x - 55, y - 30, 20, 60);
            ctx.fillRect(x + 35, y - 30, 20, 60);
            // Legs
            ctx.fillRect(x - 25, y + 40, 20, 60);
            ctx.fillRect(x + 5, y + 40, 20, 60);
        }

        function drawTallBody(ctx, x, y) {
            ctx.fillRect(x - 25, y - 60, 50, 120);
            // Arms
            ctx.fillRect(x - 45, y - 50, 15, 80);
            ctx.fillRect(x + 30, y - 50, 15, 80);
            // Legs
            ctx.fillRect(x - 20, y + 60, 15, 80);
            ctx.fillRect(x + 5, y + 60, 15, 80);
        }

        function drawDefaultBody(ctx, x, y) {
            ctx.fillRect(x - 30, y - 40, 60, 80);
            // Arms
            ctx.fillRect(x - 50, y - 30, 15, 60);
            ctx.fillRect(x + 35, y - 30, 15, 60);
            // Legs
            ctx.fillRect(x - 25, y + 40, 20, 60);
            ctx.fillRect(x + 5, y + 40, 20, 60);
        }

        function drawHead(ctx, nft, x, y) {
            // Head shape
            ctx.fillStyle = getRandomColor();
            
            switch(nft.head) {
                case 'round':
                    ctx.beginPath();
                    ctx.arc(x, y, 35, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'square':
                    ctx.fillRect(x - 35, y - 35, 70, 70);
                    break;
                default:
                    ctx.fillRect(x - 30, y - 35, 60, 70);
            }
            
            // Draw eyes
            drawEyes(ctx, nft.eyes, x, y);
            
            // Draw mouth
            drawMouth(ctx, nft.mouth, x, y);
        }

        function drawEyes(ctx, eyeType, x, y) {
            ctx.fillStyle = '#fff';
            
            switch(eyeType) {
                case 'small_dots':
                    ctx.beginPath();
                    ctx.arc(x - 12, y - 5, 3, 0, Math.PI * 2);
                    ctx.arc(x + 12, y - 5, 3, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'large_circles':
                    ctx.beginPath();
                    ctx.arc(x - 12, y - 5, 8, 0, Math.PI * 2);
                    ctx.arc(x + 12, y - 5, 8, 0, Math.PI * 2);
                    ctx.fill();
                    // Pupils
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(x - 12, y - 5, 4, 0, Math.PI * 2);
                    ctx.arc(x + 12, y - 5, 4, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'glowing':
                    ctx.shadowColor = '#00ff00';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(x - 12, y - 5, 6, 0, Math.PI * 2);
                    ctx.arc(x + 12, y - 5, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    break;
                default:
                    ctx.beginPath();
                    ctx.arc(x - 12, y - 5, 5, 0, Math.PI * 2);
                    ctx.arc(x + 12, y - 5, 5, 0, Math.PI * 2);
                    ctx.fill();
            }
        }

        function drawMouth(ctx, mouthType, x, y) {
            if (mouthType === 'none') return;
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            
            switch(mouthType) {
                case 'smile':
                    ctx.beginPath();
                    ctx.arc(x, y + 5, 10, 0, Math.PI);
                    ctx.stroke();
                    break;
                case 'frown':
                    ctx.beginPath();
                    ctx.arc(x, y + 15, 10, Math.PI, 0);
                    ctx.stroke();
                    break;
                case 'small_line':
                    ctx.beginPath();
                    ctx.moveTo(x - 5, y + 10);
                    ctx.lineTo(x + 5, y + 10);
                    ctx.stroke();
                    break;
            }
        }

        function drawClothing(ctx, clothing, x, y) {
            ctx.fillStyle = getRandomColor();
            
            switch(clothing) {
                case 'hoodie':
                    // Hood
                    ctx.fillRect(x - 40, y - 80, 80, 25);
                    // Body
                    ctx.fillRect(x - 35, y - 55, 70, 85);
                    break;
                case 'bomber_jacket':
                    ctx.fillRect(x - 40, y - 50, 80, 75);
                    // Zipper
                    ctx.strokeStyle = '#silver';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x, y - 40);
                    ctx.lineTo(x, y + 20);
                    ctx.stroke();
                    break;
                default:
                    ctx.fillRect(x - 30, y - 40, 60, 70);
            }
        }

        function drawAccessories(ctx, accessory, x, y) {
            switch(accessory) {
                case 'cap_backwards':
                    ctx.fillStyle = getRandomColor();
                    ctx.fillRect(x - 25, y - 45, 50, 10);
                    ctx.fillRect(x + 25, y - 40, 15, 5);
                    break;
                case 'chains':
                    ctx.strokeStyle = '#gold';
                    ctx.lineWidth = 4;
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.arc(x, y + 20 + (i * 10), 15, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    break;
                case 'headphones':
                    ctx.fillStyle = '#333';
                    ctx.fillRect(x - 40, y - 10, 15, 20);
                    ctx.fillRect(x + 25, y - 10, 15, 20);
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.arc(x, y - 35, 30, 0, Math.PI);
                    ctx.stroke();
                    break;
            }
        }

        function drawTools(ctx, tool, x, y) {
            switch(tool) {
                case 'spray_can':
                    ctx.fillStyle = getRandomColor();
                    ctx.fillRect(x, y - 15, 12, 30);
                    ctx.fillStyle = '#666';
                    ctx.fillRect(x + 2, y - 20, 8, 5);
                    break;
                case 'marker':
                    ctx.fillStyle = getRandomColor();
                    ctx.fillRect(x, y - 10, 6, 20);
                    ctx.fillStyle = '#333';
                    ctx.fillRect(x + 1, y - 12, 4, 3);
                    break;
                case 'multiple_cans':
                    for (let i = 0; i < 3; i++) {
                        ctx.fillStyle = getRandomColor();
                        ctx.fillRect(x + (i * 15), y - 15, 12, 30);
                        ctx.fillStyle = '#666';
                        ctx.fillRect(x + 2 + (i * 15), y - 20, 8, 5);
                    }
                    break;
            }
        }

        function drawInkEffects(ctx, width, height) {
            ctx.globalAlpha = 0.7;
            
            // Ink splatters
            for (let i = 0; i < 15; i++) {
                ctx.fillStyle = getRandomColor();
                const x = Math.random() * width;
                const y = Math.random() * height;
                const size = Math.random() * 10 + 2;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
                
                // Splatter effect
                for (let j = 0; j < 5; j++) {
                    ctx.beginPath();
                    ctx.arc(
                        x + (Math.random() - 0.5) * 20,
                        y + (Math.random() - 0.5) * 20,
                        Math.random() * 3,
                        0, Math.PI * 2
                    );
                    ctx.fill();
                }
            }
            
            // Drip effects
            for (let i = 0; i < 8; i++) {
                ctx.fillStyle = getRandomColor();
                const x = Math.random() * width;
                const startY = Math.random() * (height / 2);
                const dripHeight = Math.random() * 50 + 20;
                
                ctx.fillRect(x, startY, 3, dripHeight);
                ctx.beginPath();
                ctx.arc(x + 1.5, startY + dripHeight, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.globalAlpha = 1;
        }

        function generateNFT() {
            const nft = {
                id: ++nftCount,
                bodyType: getRandomTrait('bodyTypes'),
                head: getRandomTrait('heads'),
                eyes: getRandomTrait('eyes'),
                mouth: getRandomTrait('mouths'),
                clothing: getRandomTrait('clothing'),
                accessories: getRandomTrait('accessories'),
                tools: getRandomTrait('tools'),
                background: getRandomTrait('backgrounds')
            };
            
            nft.rarity = calculateRarity(nft);
            nft.name = `Ink Creature #${nft.id}`;
            
            return nft;
        }

        function createNFTCard(nft) {
            const card = document.createElement('div');
            card.className = 'nft-card';
            
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 400;
            
            const canvasContainer = document.createElement('div');
            canvasContainer.className = 'canvas-container';
            canvasContainer.appendChild(canvas);
            
            const info = document.createElement('div');
            info.className = 'nft-info';
            
            const name = document.createElement('div');
            name.className = 'nft-name';
            name.textContent = nft.name;
            
            const rarity = document.createElement('div');
            rarity.className = `rarity ${nft.rarity}`;
            rarity.textContent = nft.rarity.toUpperCase();
            
            info.appendChild(name);
            info.appendChild(rarity);
            
            const stats = document.createElement('div');
            stats.className = 'stats';
            
            const traits = [
                { label: 'Body', value: nft.bodyType },
                { label: 'Eyes', value: nft.eyes },
                { label: 'Clothing', value: nft.clothing },
                { label: 'Tool', value: nft.tools }
            ];
            
            traits.forEach(trait => {
                const stat = document.createElement('div');
                stat.className = 'stat';
                stat.innerHTML = `<strong>${trait.label}:</strong><br>${trait.value.replace('_', ' ')}`;
                stats.appendChild(stat);
            });
            
            card.appendChild(canvasContainer);
            card.appendChild(info);
            card.appendChild(stats);
            
            drawInkCreature(canvas, nft);
            
            return card;
        }

        function generateSingle() {
            const nft = generateNFT();
            generatedNFTs.push(nft);
            const card = createNFTCard(nft);
            document.getElementById('gallery').appendChild(card);
        }

        function generateBatch() {
            for (let i = 0; i < 10; i++) {
                generateSingle();
            }
        }

        function generateCollection() {
            for (let i = 0; i < 50; i++) {
                generateSingle();
            }
        }

        function clearGallery() {
            document.getElementById('gallery').innerHTML = '';
            generatedNFTs.length = 0;
            nftCount = 0;
        }

        function downloadAll() {
            const gallery = document.getElementById('gallery');
            const canvases = gallery.querySelectorAll('canvas');
            
            canvases.forEach((canvas, index) => {
                const link = document.createElement('a');
                link.download = `ink_creature_${index + 1}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // Generate initial collection
        generateSingle();
    </script>
</body>
</html>
